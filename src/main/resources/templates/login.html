<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeepleHub - Вход</title>

    <style>
        body {
            margin: 60px auto;
            max-width: 400px;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            color: #252525;
            background: #f5f5f5;
        }

        .container {
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            margin-top: 6px;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #292929;
            color: white;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
        }

        .error {
            color: #c0392b;
        }

        .success {
            color: #27864b;
        }

        a {
            color: #315dc9;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Вход в MeepleHub</h1>

    <p class="message error" th:if="${param.error}">
        Неверный логин или пароль. Возможно, учётная запись заблокирована.
    </p>

    <p class="message success" th:if="${param.registered}">
        Регистрация прошла успешно. Теперь вы можете войти.
    </p>

    <p class="message success" th:if="${param.logout}">
        Вы успешно вышли из системы.
    </p>

    <form th:action="@{/login}" method="post">

        <label>
            Логин
            <input type="text"
                   name="username"
                   autocomplete="username"
                   required>
        </label>

        <label>
            Пароль
            <input type="password"
                   name="password"
                   autocomplete="current-password"
                   required>
        </label>

        <button type="submit">
            Войти
        </button>

    </form>

    <p>
        Нет аккаунта?
        <a th:href="@{/registration}">Зарегистрироваться</a>
    </p>

</div>

</body>
</html>

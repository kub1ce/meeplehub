<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeepleHub - Регистрация</title>

    <style>
        body {
            margin: 60px auto;
            max-width: 450px;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            color: #252525;
            background: #f5f5f5;
        }

        .container {
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            margin-top: 6px;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #292929;
            color: white;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            color: #c0392b;
        }

        a {
            color: #315dc9;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Регистрация в MeepleHub</h1>

    <p>Создайте учётную запись, чтобы пользоваться платформой.</p>

    <p class="message"
       th:if="${message}"
       th:text="${message}">
    </p>

    <form th:action="@{/registration}"
          th:object="${registrationForm}"
          method="post">

        <label>
            Логин
            <input type="text"
                   th:field="*{username}"
                   minlength="3"
                   maxlength="30"
                   required>
        </label>

        <label>
            Email
            <input type="email"
                   th:field="*{email}"
                   maxlength="254"
                   required>
        </label>

        <label>
            Отображаемое имя
            <input type="text"
                   th:field="*{displayName}"
                   minlength="2"
                   maxlength="80"
                   required>
        </label>

        <label>
            Пароль
            <input type="password"
                   th:field="*{password}"
                   minlength="8"
                   required>
        </label>

        <button type="submit">
            Зарегистрироваться
        </button>

    </form>

    <p>
        Уже есть аккаунт?
        <a th:href="@{/login}">Войти</a>
    </p>

</div>

</body>
</html>

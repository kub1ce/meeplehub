spring.application.name=meeplehub
server.port=8080

app.name=MeepleHub
app.version=0.3.0-SNAPSHOT
app.console.enabled=false

spring.data.rest.base-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meeplehub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=${app.name}
info.app.version=${app.version}